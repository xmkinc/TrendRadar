name: insdaily Topic Radar

on:
  schedule:
    # Beijing time 09:10 and 16:10
    - cron: "10 1,8 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label for manual runs"
        required: false
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  topic-radar:
    runs-on: self-hosted
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run insdaily topic radar
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: uv run python scripts/insdaily_topic_radar.py --push

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: insdaily-topic-radar-report
          path: output/insdaily/**/*.md
          if-no-files-found: warn
