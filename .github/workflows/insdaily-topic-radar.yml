name: insdaily Topic Radar

on:
  schedule:
    # daily mode: Beijing time 09:10 and 16:10
    - cron: "10 1,8 * * *"
    # weekly mode: Beijing time Monday 10:30
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Report mode: daily or weekly"
        required: false
        default: "daily"
      runner:
        description: "Runner label for manual runs"
        required: false
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  topic-radar:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run insdaily topic radar
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 2 * * 1" ]; then
            MODE="weekly"
          fi
          uv run python scripts/insdaily_topic_radar.py --mode "$MODE" --push

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: insdaily-topic-radar-report-${{ github.event.inputs.mode || 'scheduled' }}
          path: output/insdaily/**/*.md
          if-no-files-found: warn
