# insdaily topic radar configuration
#
# This file turns the TrendRadar handoff into an editorial topic radar for
# insdaily-style WeChat articles: overseas news, celebrity/fashion, women,
# relationships, UK/living-abroad, people stories, and consumer/lifestyle.

app:
  timezone: "Asia/Shanghai"
  freshness_days: 3
  max_items_per_source: 40
  top_n: 10
  push_top_n: 8
  max_per_topic: 3
  output_dir: "output/insdaily"
  modes:
    daily:
      title: "insdaily 今日时效选题"
      description: "每天/每天两次推送，主打当天能发的明星、娱乐、海外社会和关系热议。"
      freshness_days: 2
      top_n: 10
      push_top_n: 6
      max_per_topic: 2
      source_ids:
        - "hk01-news-sitemap"
        - "eonline-top-stories"
        - "us-weekly"
        - "entertainment-tonight"
        - "ettoday-star"
        - "soompi"
        - "hello-magazine"
        - "daily-mail-showbiz"
        - "page-six"
        - "koreaboo"
        - "tmz-all"
        - "bustle"
      topic_ids:
        - "celebrity_fashion"
        - "overseas_society"
        - "women_relationships"
        - "uk_life_study"
        - "people_story"
        - "weird_internet"
    weekly:
      title: "insdaily 专题选题池"
      description: "每周推送，主打可策划、可二次加工的女性、人物、消费、审美和海外生活专题。"
      freshness_days: 10
      top_n: 14
      push_top_n: 10
      max_per_topic: 3
      source_ids:
        - "hk01-news-sitemap"
        - "vogue"
        - "harpers-bazaar"
        - "hypebae"
        - "vanity-fair"
        - "dazed"
        - "refinery29"
        - "bustle"
        - "cosmopolitan"
        - "glamour"
        - "mail-online-news"
        - "metro-uk"
        - "hello-magazine"
        - "daily-mail-showbiz"
      topic_ids:
        - "women_relationships"
        - "people_story"
        - "consumer_lifestyle"
        - "celebrity_fashion"
        - "uk_life_study"
        - "overseas_society"

score_model:
  name: "insdaily_khazix_v1"
  description: "拆分式选题评分：信源、选题贴合、爆文结构、传播信号、时效、标题形态加分，风险和弱选题扣分。"
  source_tier_points:
    A: 13
    B: 9
    C: 5
    D: 2
  source_weight_multiplier: 2
  source_max: 16
  topic_keyword_points: 3
  topic_keyword_max: 9
  viral_pattern_max: 24
  strong_signal_points: 3
  strong_signal_max: 12
  story_shape:
    max: 8
    number: 2
    contrast: 2
    question: 1.5
    public_judgement: 1.5
    punctuation: 1

risk_signals:
  hard:
    penalty: 35
    keywords:
      - "Xi Jinping"
      - "CCP"
      - "Tibet"
      - "Xinjiang"
      - "Taiwan independence"
      - "六四"
      - "习近平"
      - "中共"
      - "台独"
      - "新疆"
      - "西藏"
      - "自杀方法"
      - "suicide method"
  soft:
    penalty: 12
    keywords:
      - "alleged"
      - "accused"
      - "lawsuit"
      - "court"
      - "trial"
      - "minor"
      - "teen"
      - "death"
      - "dies"
      - "health"
      - "weight loss drug"
      - "指控"
      - "涉嫌"
      - "法院"
      - "官司"
      - "未成年"
      - "去世"
      - "死亡"
      - "病情"
      - "减肥药"

