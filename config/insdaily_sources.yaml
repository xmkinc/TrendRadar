  # A 档：每天优先看的主源。更贴近 insdaily 的爆文盘：人物、明星、
  # 女性情绪、海外社会、港台日韩娱乐与可转述的热议事件。
  - id: "hk01-news-sitemap"
    name: "香港01 新闻 sitemap"
    type: "sitemap"
    url: "https://www.hk01.com/sitemap.xml"
