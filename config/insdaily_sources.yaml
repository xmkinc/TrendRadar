strategy_options:
  - name: "快反流量款"
    use_when: "当天 TMZ、BuzzFeed、HK01 娱乐或社媒奇闻明显有爆点。"
    output: "1篇短平快，标题强情绪，正文 800-1200 字。"
  - name: "女性共鸣款"
    use_when: "人物、关系、年龄、婚恋、家庭冲突能映射中文读者处境。"
    output: "1篇中长文，故事先行，观点收束，适合她刊/谈心社式表达。"
  - name: "英国/留学信息差"
    use_when: "Guardian/HK01/NYT 出现英国政策、大学、签证、王室或海外华人议题。"
    output: "1篇信息差文章，先讲变化，再讲对留学生/华人/普通人的影响。"
  - name: "消费生活观察"
    use_when: "NYT Style、Guardian Fashion、BuzzFeed、HK01 生活类话题出现共同指向。"
    output: "1篇趋势稿，讲年轻人审美、消费心理或生活方式变化。"
